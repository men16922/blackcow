version: '3.8'

services:
  # 로컬 DynamoDB
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: shopping-fraud-dynamodb-${USER:-dev}
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    volumes:
      - ./dynamodb-data-${USER:-dev}:/home/dynamodblocal/data
    networks:
      - shopping-fraud-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 로컬 LLM (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: shopping-fraud-ollama-${USER:-dev}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./ollama-data-${USER:-dev}:/root/.ollama
    networks:
      - shopping-fraud-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  shopping-fraud-network:
    driver: bridge
