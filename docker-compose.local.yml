version: "3.8"

services:
  # 로컬 DynamoDB
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: shopping-fraud-dynamodb-${USER:-dev}
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    volumes:
      - ./dynamodb-data-${USER:-dev}:/home/dynamodblocal/data
    networks:
      - shopping-fraud-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DynamoDB Admin UI
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: shopping-fraud-dynamodb-admin-${USER:-dev}
    ports:
      - "8001:8001" # http://localhost:8001 접속
    environment:
      # dynamodb-local 컨테이너를 바라보도록 설정
      DYNAMO_ENDPOINT: "http://dynamodb-local:8000"
      AWS_REGION: "us-west-2"
      AWS_ACCESS_KEY_ID: "fakeMyKeyId"
      AWS_SECRET_ACCESS_KEY: "fakeSecretAccessKey"
    depends_on:
      - dynamodb-local
    networks:
      - shopping-fraud-network

networks:
  shopping-fraud-network:
    driver: bridge
