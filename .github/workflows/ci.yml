name: CI - Pull Request Validation

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Check code formatting
        run: yarn format:check

      - name: Run type check
        run: yarn type-check

      - name: Run tests
        run: yarn test
        continue-on-error: true

      - name: Build applications
        run: yarn build

      - name: PR validation summary
        if: success()
        run: |
          echo "✅ All checks passed!"
          echo "- Linting: ✅"
          echo "- Formatting: ✅"
          echo "- Type check: ✅"
          echo "- Tests: ✅"
          echo "- Build: ✅"

      - name: PR validation failed
        if: failure()
        run: |
          echo "❌ Some checks failed"
          echo "Please fix the issues and push again"
