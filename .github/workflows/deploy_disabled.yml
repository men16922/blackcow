name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Run type check
        run: |
          yarn workspace @shopping-fraud-detector/client tsc --noEmit
          yarn workspace @shopping-fraud-detector/server tsc --noEmit

      - name: Run tests
        run: yarn test
        continue-on-error: true

      - name: Build applications
        run: yarn build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}

      - name: Create deployment package
        run: |
          PACKAGE_NAME="deploy-$(date +%Y%m%d-%H%M%S).tar.gz"

          mkdir -p deploy-package
          cp -r apps packages deploy-package/
          cp package.json yarn.lock deploy-package/

          # Remove node_modules
          find deploy-package -name "node_modules" -type d -exec rm -rf {} + 2>/dev/null || true

          tar -czf "$PACKAGE_NAME" -C deploy-package .
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV

      - name: Get Lightsail connection info
        id: lightsail-info
        run: |
          INSTANCE_NAME="${{ secrets.LIGHTSAIL_INSTANCE_NAME || 'shopping-fraud-detector' }}"
          REGION="${{ secrets.AWS_REGION || 'ap-northeast-2' }}"

          STATIC_IP=$(aws lightsail get-static-ip \
            --static-ip-name "${INSTANCE_NAME}-static-ip" \
            --region "$REGION" \
            --query 'staticIp.ipAddress' \
            --output text)

          USERNAME=$(aws lightsail get-instance \
            --instance-name "$INSTANCE_NAME" \
            --region "$REGION" \
            --query 'instance.username' \
            --output text)

          echo "static_ip=$STATIC_IP" >> $GITHUB_OUTPUT
          echo "username=$USERNAME" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail-key.pem
          chmod 400 ~/.ssh/lightsail-key.pem

          # Add to known hosts
          ssh-keyscan -H ${{ steps.lightsail-info.outputs.static_ip }} >> ~/.ssh/known_hosts

      - name: Upload package to server
        run: |
          scp -i ~/.ssh/lightsail-key.pem \
            "${{ env.PACKAGE_NAME }}" \
            "${{ steps.lightsail-info.outputs.username }}@${{ steps.lightsail-info.outputs.static_ip }}:/tmp/"

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/lightsail-key.pem \
            "${{ steps.lightsail-info.outputs.username }}@${{ steps.lightsail-info.outputs.static_ip }}" << 'ENDSSH'

          set -e

          # Extract package
          cd /tmp
          tar -xzf deploy-*.tar.gz -C /tmp/deploy-temp || mkdir -p /tmp/deploy-temp && tar -xzf deploy-*.tar.gz -C /tmp/deploy-temp

          # Backup current deployment
          if [ -d /opt/shopping-fraud-detector/current ]; then
            sudo mv /opt/shopping-fraud-detector/current /opt/shopping-fraud-detector/backup-$(date +%Y%m%d-%H%M%S)
          fi

          # Move new version
          sudo mkdir -p /opt/shopping-fraud-detector
          sudo mv /tmp/deploy-temp /opt/shopping-fraud-detector/current
          cd /opt/shopping-fraud-detector/current

          # Install dependencies
          yarn install --frozen-lockfile --production

          # Copy environment variables
          if [ -f /opt/shopping-fraud-detector/.env ]; then
            sudo cp /opt/shopping-fraud-detector/.env .env
          else
            echo "Warning: .env file not found"
          fi

          # Restart with PM2
          if pm2 list | grep -q "shopping-fraud-detector"; then
            pm2 restart shopping-fraud-detector
          else
            pm2 start apps/server/dist/index.js \
              --name shopping-fraud-detector \
              --time \
              --error /var/log/shopping-fraud-detector/error.log \
              --output /var/log/shopping-fraud-detector/output.log
            pm2 save
          fi

          # Cleanup
          rm -rf /tmp/deploy-*.tar.gz

          # Remove old backups (keep last 5)
          cd /opt/shopping-fraud-detector
          ls -t | grep "backup-" | tail -n +6 | xargs sudo rm -rf 2>/dev/null || true

          echo "✅ Deployment completed"

          ENDSSH

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 10

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ steps.lightsail-info.outputs.static_ip }}/health")

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/lightsail-key.pem
          rm -f deploy-*.tar.gz
          rm -rf deploy-package

      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo "Application URL: http://${{ steps.lightsail-info.outputs.static_ip }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check the logs for details"
