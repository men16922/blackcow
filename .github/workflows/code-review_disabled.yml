name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            apps/**/*.js
            apps/**/*.jsx
            apps/**/*.ts
            apps/**/*.tsx
            packages/**/*.js
            packages/**/*.jsx
            packages/**/*.ts
            packages/**/*.tsx

      - name: Setup Node.js
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: AI Code Review
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Install dependencies
          npm install @anthropic-ai/sdk @octokit/rest

          # Create review script
          cat > review.js << 'SCRIPT'
          const Anthropic = require('@anthropic-ai/sdk');
          const { Octokit } = require('@octokit/rest');
          const { execSync } = require('child_process');

          async function main() {
            const anthropic = new Anthropic({
              apiKey: process.env.ANTHROPIC_API_KEY
            });

            const octokit = new Octokit({
              auth: process.env.GITHUB_TOKEN
            });

            // Get PR details
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const prNumber = process.env.PR_NUMBER;

            // Get changed files
            const changedFiles = process.env.CHANGED_FILES.split(' ').filter(f => f);

            console.log(`Reviewing ${changedFiles.length} files...`);

            for (const file of changedFiles) {
              try {
                // Get file diff
                const diff = execSync(`git diff origin/${{ github.base_ref }} HEAD -- "${file}"`, {
                  encoding: 'utf-8',
                  maxBuffer: 10 * 1024 * 1024
                });

                if (!diff || diff.trim().length === 0) {
                  console.log(`Skipping ${file}: no diff`);
                  continue;
                }

                // Request AI review with retry logic
                console.log(`Analyzing ${file}...`);
                let message;
                let retries = 3;

                while (retries > 0) {
                  try {
                    message = await anthropic.messages.create({
                      model: 'claude-3-5-sonnet-20241022',
                      max_tokens: 4096,
                      temperature: 0.3,
                      messages: [{
                    role: 'user',
                    content: `You are an expert code reviewer. Analyze the following code changes and provide a thorough review.

Focus on:
1. 🐛 **Bugs & Errors**: Logic errors, potential runtime errors, edge cases
2. 🔒 **Security**: Vulnerabilities (SQL injection, XSS, authentication issues, etc.)
3. 🎯 **Best Practices**: Code style, naming conventions, design patterns
4. ⚡ **Performance**: Inefficiencies, unnecessary operations, optimization opportunities
5. 🧪 **Testing**: Missing test cases, test coverage
6. 📖 **Readability**: Code clarity, comments, documentation

File: ${file}

\`\`\`diff
${diff}
\`\`\`

Provide your review in the following format:

## Summary
Brief overview of the changes (1-2 sentences)

## Issues Found
List specific issues with line references if possible

## Recommendations
Concrete suggestions for improvement

## Positive Notes
What's done well in this PR

Keep your review constructive and actionable. If there are no significant issues, say so!`
                      }]
                    });
                    break; // Success, exit retry loop
                  } catch (apiError) {
                    retries--;
                    if (retries === 0) throw apiError;
                    console.log(`API error, retrying... (${retries} attempts left)`);
                    await new Promise(resolve => setTimeout(resolve, 5000));
                  }
                }

                const reviewComment = message.content[0].text;

                // Post review comment
                await octokit.pulls.createReview({
                  owner,
                  repo,
                  pull_number: parseInt(prNumber),
                  body: `## 🤖 AI Code Review for \`${file}\`\n\n${reviewComment}\n\n---\n*Generated by Claude Sonnet 4.5*`,
                  event: 'COMMENT'
                });

                console.log(`✅ Review posted for ${file}`);

                // Rate limiting: wait between requests
                await new Promise(resolve => setTimeout(resolve, 2000));

              } catch (error) {
                console.error(`Error reviewing ${file}:`, error.message);
              }
            }

            console.log('Code review complete!');
          }

          main().catch(console.error);
          SCRIPT

          # Run review
          export PR_NUMBER="${{ github.event.pull_request.number }}"
          export CHANGED_FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          node review.js

      - name: Post Summary
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fileCount = '${{ steps.changed-files.outputs.all_changed_files }}'.split(' ').filter(f => f).length;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎯 AI Code Review Summary

**Files Reviewed**: ${fileCount}
**Status**: ✅ Complete

AI has analyzed your code changes. Please check the review comments above for detailed feedback.

### What's Next?
- 📝 Review the AI suggestions
- ✏️ Address any critical issues
- 💬 Reply to comments if you need clarification
- ✅ Mark conversations as resolved when fixed

---
*Powered by Claude Sonnet 4.5 🚀*`
            });

      - name: No Code Changes
        if: steps.changed-files.outputs.any_changed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🤖 AI Code Review\n\nNo code files were changed in this PR. Skipping review.'
            });
